name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The engine-purity rule. packages/engine has to stay importable from a
      # browser bundle, which means no AWS SDK and no Node built-ins. This is a
      # required check, not advisory — see docs/decisions/007.
      - name: Enforce engine purity
        run: pnpm dep:cruise

      - name: Test
        run: pnpm test

      - name: Rulepack hash is current
        run: |
          pnpm --filter @fc/rulepack lock
          git diff --exit-code packages/rulepack/data/v1.lock.json \
            || (echo "::error::rulepack data changed without regenerating the lock. Run: pnpm --filter @fc/rulepack lock" && exit 1)

      - name: Build web
        run: pnpm web:build

      # Synth needs no credentials — the stack is env-agnostic in CI. cdk-nag
      # runs as an Aspect, and AwsSolutionsChecks raises errors rather than
      # warnings, so an unreviewed finding fails the build here. Suppressions
      # live in the stack with their reasons.
      - name: Synth infrastructure and run cdk-nag
        run: pnpm cdk:synth --quiet
        env:
          CDK_DISABLE_CLI_TELEMETRY: '1'
      # The domain-correctness gate. `eval:assert` regenerates 200 seeded claim
      # packs, injects 0–3 known faults into each, settles them through the real
      # engine under two profiles — clean rows, and rows degraded the way OCR
      # degrades them and categorised by the real tier-1 normaliser — and fails
      # the build if detection precision or recall regresses against
      # packages/eval/baseline.json or baseline.degraded.json, if a lawful
      # deduction starts being disputed, or if a lawful control drops out of
      # the measured set. Every number is against a generated corpus with
      # injected faults, never a claim about real-world accuracy
      # (fixtures/corpus/PROVENANCE.md, docs/evaluation.md).
      - name: Evaluation regression gate
        run: pnpm eval:assert
