# The static bundle, with the cache rules WebStack gives CloudFront.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # Vite fingerprints everything under /assets, so it is immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The API lives in the api service; same-origin keeps the session cookie first-party.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-sent events: no buffering, long-lived.
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 30m;
  }

  # index.html is never cached: a deploy must not leave a viewer on a stale
  # document pointing at deleted asset hashes.
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }
}
